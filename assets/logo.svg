<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="fs-title">
  <title id="fs-title">flight-shield</title>
  <defs>
    <!-- Red to orange gradient -->
    <linearGradient id="g-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <!-- Subtle face highlight -->
    <linearGradient id="g-face" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft drop shadow -->
    <filter id="f-shadow" x="-12%" y="-8%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#991B1B" flood-opacity="0.5"/>
    </filter>
    <!-- Glow on bolt -->
    <filter id="f-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path
    d="M256 34 L442 102 L442 232 C442 354 354 440 256 476 C158 440 70 354 70 232 L70 102 Z"
    fill="url(#g-shield)"
    filter="url(#f-shadow)"
  />

  <!-- 3D bevel: left darker face -->
  <path
    d="M256 34 L70 102 L70 232 C70 354 158 440 256 476 L256 34 Z"
    fill="#000000"
    fill-opacity="0.12"
  />

  <!-- Shine overlay -->
  <path
    d="M256 34 L442 102 L442 232 C442 354 354 440 256 476 C158 440 70 354 70 232 L70 102 Z"
    fill="url(#g-face)"
  />

  <!-- Inner border ring -->
  <path
    d="M256 58 L420 118 L420 232 C420 338 340 416 256 450 C172 416 92 338 92 232 L92 118 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.15"
    stroke-width="5"
  />

  <!-- Wings — left -->
  <path
    d="M198 220 L128 196 L152 232 L128 268 L198 244 Z"
    fill="#FFFFFF"
    filter="url(#f-glow)"
  />
  <!-- Wings — right -->
  <path
    d="M314 220 L384 196 L360 232 L384 268 L314 244 Z"
    fill="#FFFFFF"
    filter="url(#f-glow)"
  />

  <!-- Lightning bolt (centered) -->
  <path
    d="M272 118 L186 254 L244 254 L216 390 L330 222 L268 222 L298 118 Z"
    fill="#FFFFFF"
    filter="url(#f-glow)"
  />
</svg>
